<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ECEFEE">
<title>言象审核台</title>
<style>
/*
 * Palette from blue-green landscape painting (青绿山水) minerals: a cool moon-white workspace, ink text,
 * azurite for navigation and primary actions, malachite for approval, gold leaf for whatever waits on
 * the creator (reviews, grants that cost money), cinnabar only for errors. Pictures and clips sit on a
 * dark ink well so their colour is judged against neutral, not against the page.
 */
:root {
  color-scheme: light;
  --moon: #ECEFEE; --silk: #F8F9F8; --rail: #E1E6E5;
  --ink: #1E2629; --ink-2: #5B676C; --line: #D3DAD9; --line-2: #E3E8E7;
  --azurite: #1F4E6E; --azurite-hover: #173E58; --azurite-soft: #DDE7EE;
  --malachite: #2B6E5B; --malachite-hover: #225A4A; --malachite-soft: #DCEBE5;
  --gold: #C9912E; --gold-hover: #B9852A; --gold-ink: #7A520F; --gold-soft: #F6EBD3;
  --well: #1B2125; --well-muted: #8D989E;
  --bad: #A7332B; --bad-soft: #F6E1DE;
  --ui: "PingFang SC", "Hiragino Sans GB", -apple-system, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --read: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif CJK SC", serif;
}
* { box-sizing: border-box }
html { scroll-padding-top: 150px; scroll-padding-bottom: 200px; -webkit-text-size-adjust: 100% }
html, body { margin: 0 }
@media (pointer: fine) { html { overscroll-behavior: none } }
body { font: 14px/1.6 var(--ui); background: var(--moon); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: rgba(31, 78, 110, .14) }
button, select, textarea, input { font: inherit; color: inherit }
button, a, summary, select, label { touch-action: manipulation }
a { color: var(--azurite) }
:focus-visible { outline: 2px solid var(--azurite); outline-offset: 2px }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
.skip { position: absolute; left: 12px; top: -48px; z-index: 50; background: var(--azurite); color: #fff; padding: 8px 14px; border-radius: 6px; text-decoration: none }
.skip:focus-visible { top: 12px }

/* ---------- side ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; background: var(--rail); border-right: 1px solid var(--line); padding: 18px 12px 18px; display: flex; flex-direction: column; gap: 16px }
.brand { display: flex; align-items: baseline; gap: 10px; padding: 0 8px }
.brand b { font: 600 22px/1 var(--ui); letter-spacing: .12em; color: var(--azurite) }
.brand span { font-size: 12px; color: var(--ink-2) }
.engine { display: grid; gap: 9px; padding: 10px; background: var(--silk); border: 1px solid var(--line); border-radius: 8px }
.engine select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background-color: #fff; color: var(--ink) }
.state { display: flex; align-items: center; gap: 8px; font-size: 13px; min-height: 28px }
.state .sp { flex: 1 }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #9AA5A9; flex: none }
.dot.on { background: var(--malachite) } .dot.off { background: var(--bad) } .dot.idle { background: var(--gold) }
.ledger { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; padding-top: 8px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--ink-2) }
.ledger dd { margin: 0; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums }
.nav .grp { margin: 14px 8px 4px; font: 500 12px/1.4 var(--ui); color: var(--ink-2); display: flex; justify-content: space-between }
.nav .grp:first-child { margin-top: 0 }
.nav .item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--ink); text-decoration: none }
.nav .item:hover { background: rgba(255, 255, 255, .65) }
.nav .item.sel { background: var(--silk); color: var(--azurite); font-weight: 600; box-shadow: inset 3px 0 0 var(--azurite) }
.nav .item .lb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.nav .n { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; background: var(--line); color: var(--ink-2) }
.nav .n.need { background: var(--gold); color: var(--ink) }
.nav .n.bad { background: var(--bad); color: #fff }
.nav .none { padding: 4px 10px; font-size: 12px; color: var(--ink-2) }

/* ---------- top ---------- */
.mainwrap { min-width: 0; display: flex; flex-direction: column }
.top { position: sticky; top: 0; z-index: 4; background: rgba(236, 239, 238, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 32px 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 10px 36px; align-items: end }
.top h1 { margin: 0; font: 600 20px/1.3 var(--ui); text-wrap: balance }
.top .sub { color: var(--ink-2); font-size: 13px; margin-top: 2px }
.phases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px }
.phase { min-width: 0 }
.phase .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; white-space: nowrap }
.phase .lbl em { font-style: normal; font-variant-numeric: tabular-nums; white-space: nowrap }
.segbar { display: flex; gap: 2px; height: 6px }
.segbar i { flex: 1; background: var(--line); display: flex; overflow: hidden; border-radius: 1px }
.segbar b { height: 100% }
.segbar b.g { background: var(--malachite) } .segbar b.y { background: var(--gold) } .segbar b.n { background: var(--azurite) } .segbar b.r { background: var(--bad) }
main { padding: 26px 32px 220px; max-width: 1600px; width: 100% }
main:focus { outline: none }

/* ---------- common ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--silk); color: var(--ink); cursor: pointer; white-space: nowrap; font-weight: 500; text-decoration: none }
.btn:hover { background: #fff; border-color: #8E9BA0 }
.btn:active { background: var(--line-2) }
.btn:disabled { opacity: .55; cursor: default }
.btn[aria-busy="true"] { cursor: progress }
.btn[aria-busy="true"]::after { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite }
.btn.primary { background: var(--azurite); border-color: var(--azurite); color: #fff }
.btn.primary:hover { background: var(--azurite-hover); border-color: var(--azurite-hover) }
.btn.pass { background: var(--malachite); border-color: var(--malachite); color: #fff }
.btn.pass:hover { background: var(--malachite-hover); border-color: var(--malachite-hover) }
.btn.spend { background: var(--gold); border-color: var(--gold-hover); color: var(--ink) }
.btn.spend:hover { background: var(--gold-hover) }
.btn.quiet { background: transparent; border-color: transparent; color: var(--ink-2) }
.btn.quiet:hover { background: rgba(255, 255, 255, .7); color: var(--ink) }
.btn.sm { min-height: 28px; padding: 3px 10px; font-size: 12px }
.btn.big { min-height: 40px; padding: 8px 20px; font-size: 15px }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 3px; font-size: 12px; line-height: 20px; font-weight: 500; background: var(--line-2); color: var(--ink-2); white-space: nowrap }
.tag.gold { background: var(--gold-soft); color: var(--gold-ink) }
.tag.green { background: var(--malachite-soft); color: var(--malachite) }
.tag.red { background: var(--bad-soft); color: var(--bad) }
.tag.blue { background: var(--azurite-soft); color: var(--azurite) }
.meta { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap }
.hint { font-size: 12px; color: var(--ink-2) }
.notice { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; font-size: 13px; background: var(--gold-soft); color: var(--gold-ink); border-left: 3px solid var(--gold); border-radius: 0 4px 4px 0 }
.notice > span { min-width: 0; overflow-wrap: anywhere }
.notice.bad { background: var(--bad-soft); color: var(--bad); border-left-color: var(--bad) }
.notice.ok { background: var(--malachite-soft); color: var(--malachite); border-left-color: var(--malachite) }
.notice .btn { margin-left: auto }
.empty { padding: 72px 20px; max-width: 480px; margin: 0 auto; text-align: center; color: var(--ink-2) }
.empty svg.i { width: 32px; height: 32px; margin-bottom: 10px; stroke-width: 1.3; color: #9AA7AB }
.empty b { display: block; color: var(--ink); font-weight: 600; font-size: 16px; margin-bottom: 4px }
.empty p { margin: 0 0 16px }
h2.sec { font: 600 16px/1.4 var(--ui); margin: 36px 0 14px; display: flex; align-items: center; gap: 8px; text-wrap: balance }
h2.sec:first-child { margin-top: 0 }
pre { white-space: pre-wrap; margin: 0; font: 15px/1.9 var(--read); color: var(--ink); max-width: 40em; overflow-wrap: anywhere }
textarea { display: block; width: 100%; min-height: 96px; padding: 10px 12px; border: 1px solid #B6C0C3; border-radius: 6px; background: #fff; resize: vertical; line-height: 1.7 }
textarea:hover { border-color: #8E9BA0 }
textarea:focus-visible { outline: none; border-color: var(--azurite); box-shadow: 0 0 0 3px rgba(31, 78, 110, .2) }
textarea[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 3px rgba(167, 51, 43, .15) }
.field-err { color: var(--bad); font-size: 12px; margin-top: 4px }
textarea::placeholder { color: #87949A }
.drawer { border-top: 1px solid var(--line-2) }
.drawer > summary { list-style: none; cursor: pointer; padding: 9px 2px; font-size: 13px; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 8px; user-select: none; border-radius: 4px }
.drawer > summary:hover { color: var(--azurite) }
.drawer > summary::-webkit-details-marker { display: none }
.drawer > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; margin: 0 2px 0 4px }
.drawer[open] > summary::before { transform: rotate(45deg) }
.drawer > .body { padding: 2px 2px 14px 18px }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; display: inline-block; vertical-align: -2px; flex: none }
.spin.sm { width: 10px; height: 10px; border-width: 1.5px }
@keyframes spin { to { transform: rotate(360deg) } }
.skeleton { height: 120px; border-radius: 4px; background: var(--line-2); animation: sk 1.4s ease-in-out infinite alternate }
@keyframes sk { to { opacity: .45 } }
.panel { background: var(--silk); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; display: grid; gap: 10px; max-width: 46em; margin-top: 24px }
.panel label b { font-weight: 600 }
.row-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.row-actions .sp { flex: 1 }

/* ---------- media ---------- */
.well { background: var(--well); border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--well-muted); font-size: 12px; min-width: 0 }
.well.square { aspect-ratio: 1 }
.zoom { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in }
.zoom img { display: block; width: 100%; height: auto; object-fit: contain }
.zoom:focus-visible { outline: 2px solid #9CC3DD; outline-offset: -4px }
video, audio { max-width: 100%; display: block }
.well video { width: 100%; background: #000 }

/* ---------- reviews ---------- */
.rv { padding-bottom: 36px; margin-bottom: 36px; border-bottom: 1px solid var(--line) }
.rv:last-child { border-bottom: 0; margin-bottom: 0 }
.rv-head { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; margin-bottom: 12px }
.rv-head .kind { align-self: center }
.rv-head h2 { margin: 0; font: 600 18px/1.35 var(--ui); text-wrap: balance }
.rv-head .sp { flex: 1 }
.up { color: var(--ink-2); font-weight: 500; margin-right: .5em }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start }
.stage .zoom img { max-height: 74vh }
.desk { display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.desk.wide { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 560px); gap: 28px; margin-top: 18px; align-items: start }
.desk .info { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.desk .info:empty { display: none }
.desk .info > .drawers { border-bottom: 1px solid var(--line-2) }
.desk .act { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.desk.wide .info:empty + .act { grid-column: 1 / -1; max-width: 720px }
.note label { display: block; font-weight: 600; margin-bottom: 6px }
.note-bar { display: flex; gap: 12px; align-items: center; margin-top: 8px }
.note-bar .hint { flex: 1; min-width: 0 }
.note.none { font-size: 13px; color: var(--ink-2); padding: 10px 12px; background: var(--line-2); border-radius: 4px }
.decide { display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap }
.decide .sp { flex: 1 }
.cands { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)) }
.cand { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.cand-bar { display: flex; align-items: center; gap: 10px }
.cand-bar .sp { flex: 1 }
.reading { white-space: pre-wrap; font: 16px/1.95 var(--read); color: var(--ink); background: var(--silk); border: 1px solid var(--line); border-radius: 4px; padding: 20px 26px; max-height: 70vh; overflow: auto; overscroll-behavior: contain; overflow-wrap: anywhere }
.reading > div { max-width: 40em }
.clip { display: grid; grid-template-columns: minmax(0, 3fr) minmax(320px, 2fr); gap: 16px; align-items: start }
.clip.solo { grid-template-columns: minmax(0, 1fr) }
.clip > .well { position: sticky; top: 150px }
.tl { background: var(--silk); border: 1px solid var(--line); border-radius: 4px; max-height: 70vh; overflow: auto; overscroll-behavior: contain }
.tl .cut { position: sticky; top: 0; z-index: 1; background: var(--rail); padding: 8px 12px; border-bottom: 1px solid var(--line) }
.cut-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
.cut-h .t { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums }
.tl .cam { font-size: 12px; color: var(--ink-2); margin-top: 2px }
.tl .shot { font-size: 13px; margin-top: 2px }
.tl .sec { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; width: 100%; text-align: left; padding: 6px 12px; border: 0; border-bottom: 1px solid var(--line-2); background: none; font-size: 13px; line-height: 1.65; color: var(--ink) }
.tl button.sec { cursor: pointer }
.tl button.sec:hover { background: #fff }
.tl button.sec:focus-visible { outline-offset: -2px }
.tl .sec.now { background: var(--gold-soft); box-shadow: inset 3px 0 0 var(--gold) }
.tl .sec .t { color: var(--azurite); font-weight: 600; font-variant-numeric: tabular-nums }
.tl .line { display: block; color: var(--malachite); margin-top: 2px }
table.checks { width: 100%; border-collapse: collapse; font-size: 13px }
table.checks td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top }
table.checks td:first-child { color: var(--ink-2); width: 120px }

/* ---------- library ---------- */
.ent { display: grid; grid-template-columns: var(--cover) minmax(0, 1fr); gap: 28px; padding: 26px 0; border-bottom: 1px solid var(--line); align-items: start }
.ent:first-child { padding-top: 0 }
.ent:last-child { border-bottom: 0 }
.ents.characters { --cover: 300px } .ents.locations { --cover: 520px } .ents.props { --cover: 420px }
.cover.tall { aspect-ratio: 2 / 3 } .cover.wide { aspect-ratio: 16 / 9 }
.cover .zoom, .cover .zoom img { height: 100% }
.ent-body { min-width: 0 }
.ent-body h2 { margin: 0 0 12px; font: 600 18px/1.35 var(--ui); display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.thumbs { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px }
.thumb { margin: 0; width: 220px; min-width: 0 }
.thumb.square { width: 124px }
.thumb .well { aspect-ratio: 16 / 9 }
.thumb.square .well { aspect-ratio: 1 }
.thumb .zoom, .thumb .zoom img { height: 100% }
.thumb figcaption { font-size: 12px; color: var(--ink-2); margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.thumb figcaption small { flex-basis: 100%; font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.revise { display: none; flex-direction: column; gap: 8px; margin-top: 8px; max-width: 46em }
.revise.open { display: flex }
.lib-act { padding: 8px 0 4px }
.seg { padding-bottom: 28px; margin-bottom: 28px; border-bottom: 1px solid var(--line) }
.seg:last-child { border-bottom: 0 }
.seg > header { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin-bottom: 14px }
.seg > header h2 { margin: 0; font: 600 18px/1.35 var(--ui) }
.seg > header .sum { flex-basis: 100%; color: var(--ink-2); font-size: 14px; max-width: 50em }
.seg > .body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 460px); gap: 20px }
.kfs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; align-content: start }
.kf { font-size: 12px; color: var(--ink-2); min-width: 0 }
.kf .well { aspect-ratio: 16 / 9; margin-bottom: 4px; text-align: center; padding: 2px }
.kf .well:has(.zoom) { padding: 0 }
.kf .zoom, .kf .zoom img { height: 100% }
.kf .zoom img { object-fit: cover }
.kf .cap { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.kf .cap .t { font-variant-numeric: tabular-nums }
.clips { display: grid; gap: 28px; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)) }
.clips.voices { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) }
.clipbox { display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.clipbox h3 { margin: 0; font: 600 15px/1.4 var(--ui); display: flex; gap: 8px; align-items: center }
.clipbox audio { width: 100% }

/* ---------- script ---------- */
.screenplay { display: grid; grid-template-columns: minmax(0, 46em) minmax(240px, 340px); gap: 40px; align-items: start }
.page { background: var(--silk); border: 1px solid var(--line); border-radius: 4px; padding: 36px 44px; font: 16px/1.95 var(--read); color: var(--ink); overflow-wrap: anywhere }
.page .h { font: 600 15px/1.6 var(--ui); color: var(--azurite); margin: 30px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline }
.page .h:first-child { margin-top: 0 }
.page .h .sid { color: var(--ink-2); font-weight: 500; font-size: 13px }
.page .set { color: var(--ink-2); font-size: 15px; border-left: 2px solid var(--line); padding: 2px 0 2px 12px; margin: 6px 0 12px }
.page .say { padding-left: 2em }
.page .say b { font: 600 14px/1 var(--ui); color: var(--malachite) }
.page .vo b { color: var(--azurite) }
.page .chg { font: 13px/1.7 var(--ui); color: var(--gold-ink); padding-left: 2em }
.page .chg::before { content: "变化"; font-size: 11px; background: var(--gold-soft); border-radius: 3px; padding: 1px 5px; margin-right: 6px }
.page .beat { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px dashed var(--line) }
.page .h + .beat, .page .set + .beat { border-top: 0 }
.page .beat .id { font: 12px/1.5 var(--ui); color: var(--ink-2); padding-top: 7px; font-variant-numeric: tabular-nums }
.aside { position: sticky; top: 150px; max-height: calc(100vh - 170px); overflow: auto; overscroll-behavior: contain; border-left: 1px solid var(--line); padding: 2px 0 2px 22px; font-size: 13px }
.aside h2 { margin: 0 0 10px; font: 600 14px/1.4 var(--ui) }
.people { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px }
.people b { font-weight: 600; margin-right: 6px }
.people .tag { margin-left: 6px }
.aside dl { margin: 0 0 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px }
.aside dt { color: var(--ink-2) }
.aside dd { margin: 0 }
.stat { display: flex; gap: 16px; margin-bottom: 14px; color: var(--ink-2) }
.stat b { color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; margin-right: 2px }

/* ---------- story ---------- */
.compose { max-width: 820px; display: grid; gap: 14px; padding-bottom: 32px }
.compose h2 { margin: 0; font: 600 22px/1.4 var(--ui) }
.compose p { margin: 0; color: var(--ink-2); max-width: 40em }
.compose textarea { min-height: 120px; font: 17px/1.8 var(--read) }
.stories { border-top: 1px solid var(--line); max-width: 960px }
.story-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 12px 8px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none }
.story-row:hover { background: rgba(255, 255, 255, .65) }
.story-row .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500 }
.back { margin-bottom: 12px }
.steps { display: flex; flex-wrap: wrap; list-style: none; margin: 0 0 26px; padding: 0; gap: 6px 0 }

  <button type="button" class="close" id="lbclose" onclick="closeLb()" aria-label="关闭大图（Esc）"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button type="button" class="nav-btn prev" onclick="stepLb(-1)" aria-label="上一张（←）"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>

</div>
<script>
const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const ICON = {

  star: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  pin: '<path d="M12 21s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/>',
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  scroll: '<path d="M8 3h11v15a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-1h11v1a3 3 0 0 0 3 3"/><path d="M8 3a3 3 0 0 0-3 3v11M11 8h5M11 12h5"/>',
  film: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/>',
  pulse: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  play2: '<path d="m7 5 12 7-12 7Z"/>', pause: '<path d="M8 5v14M16 5v14"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
  video: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/>',
  check: '<path d="m5 12 5 5 9-10"/>', edit: '<path d="M4 20h4L19 9l-4-4L4 16Z"/>', redo: '<path d="M20 7v5h-5"/><path d="M20 12a8 8 0 1 0-2.3 5.7"/>',
  inbox: '<path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v6H3v-6Z"/>', alert: '<path d="M12 3 2 20h20Z"/><path d="M12 10v4M12 17v.5"/>',
  back: '<path d="M15 6l-6 6 6 6"/>', sparkle: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  coin: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5"/>',
  down: '<path d="m6 9 6 6 6-6"/>', up: '<path d="m6 15 6-6 6 6"/>',
}
const icon = n => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICON[n] + '</svg>'

let S = null, L = null, PROJ = null, STORIES = [], ST = null, SID = null
let tab = null
let lastKey = '', lastTab = null
let dockFold = localStorage.getItem('yx.dock') === 'fold'

// ---------- helpers ----------
const money = d => new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'USD', currencyDisplay: 'narrowSymbol', minimumFractionDigits: 2, maximumFractionDigits: d })
const USD3 = money(3), USD4 = money(4)
const usd = n => USD3.format(n)
const WHEN = new Intl.DateTimeFormat('zh-CN', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })
// Story ids are the UTC time they were started (storyflow.ts), yyyymmddhhmmss.
const storyTime = id => { const m = /^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)$/.exec(id); return m ? WHEN.format(new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]))) : '' }
function toast(text, err) {
  const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = text
  if (err) d.setAttribute('role', 'alert')
  $('#toasts').append(d); setTimeout(() => d.remove(), err ? 6000 : 2400)
}
// While an overlay is open the page behind it takes no focus or clicks; focus goes back where it was.
let returnFocus = null
function hold(on) {
  for (const el of [$('.app'), $('#dock')]) el.inert = on
  if (on) returnFocus = document.activeElement
  else if (returnFocus && returnFocus.isConnected) returnFocus.focus({ preventScroll: true })
}
function ask(title, body, ok = '确定', tone = 'primary') {
  return new Promise(res => {
    $('#mtitle').textContent = title; $('#mbody').textContent = body || ''; $('#myes').textContent = ok
    $('#myes').className = 'btn ' + tone
    const m = $('#modal'); m.classList.add('show'); hold(true); $('#mno').focus()
    const done = v => { m.classList.remove('show'); $('#myes').onclick = $('#mno').onclick = m.onclick = null; hold(false); res(v) }
    $('#myes').onclick = () => done(true); $('#mno').onclick = () => done(false)
    m.onclick = e => { if (e.target === m) done(false) }
  })
}
// The button that started a request shows it is busy until the engine answers.
let clicked = null
document.addEventListener('click', e => { if (!e.target.closest('#modal')) clicked = e.target.closest('button') }, true)
async function api(path, data, done) {
  const btn = clicked; clicked = null
  if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true') }
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data || {}) })
    const j = await r.json()
    if (j.ok === false || (j.error && !j.id)) { toast(j.error, true); return null }
    if (done) toast(done)
    return j
  } catch (e) { toast('连不上引擎：确认 bun src/m1/run.ts 还在跑', true); return null }
  finally { if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy') } }
}
const refresh = () => { lastKey = ''; return Promise.all([loadStatus(), loadProjects(), LIB[tab] ? loadLib() : null]) }
async function act(path, data, done) { const j = await api(path, data, done); await refresh(); return j }
const decide = (review, data, done) => act('/api/reviews/' + review + '/decision', data, done)
// An empty required note is marked where it is, with the message under it.
function needText(el, msg) {
  const v = el.value.trim()
  if (v) return v
  const id = el.id + '-err'
  el.setAttribute('aria-invalid', 'true'); el.setAttribute('aria-errormessage', id)
  if (!document.getElementById(id)) el.insertAdjacentHTML('afterend', '<div class="field-err" id="' + id + '" role="alert">' + esc(msg) + '</div>')
  el.focus(); return ''
}
// What the creator has typed survives re-renders, switching pages and reloads, until it is sent.
const DRAFTS = JSON.parse(sessionStorage.getItem('yx.drafts') || '{}')
const saveDrafts = () => sessionStorage.setItem('yx.drafts', JSON.stringify(DRAFTS))
function clearDraft(el) { el.value = ''; delete DRAFTS[el.dataset.keep]; saveDrafts() }
document.addEventListener('input', e => {
  const t = e.target
  if (t.dataset && t.dataset.keep) { if (t.value) DRAFTS[t.dataset.keep] = t.value; else delete DRAFTS[t.dataset.keep]; saveDrafts() }
  if (t.value && t.getAttribute('aria-invalid')) { t.removeAttribute('aria-invalid'); const m = document.getElementById(t.id + '-err'); if (m) m.remove() }
})
window.addEventListener('beforeunload', e => { if (Object.values(DRAFTS).some(v => v.trim())) { e.preventDefault(); e.returnValue = '' } })

function scopeParts(scope) {
  const p = String(scope).split('/')
  if (p[1] === 'char' || p[1] === 'prop' || p[1] === 'loc') return p.slice(2)
  if (p.length === 3 && p[1] === 'scene') return ['第\u00a0' + p[2].replace(/^\D+/, '') + '\u00a0场']
  if (p.length === 3 && p[2].startsWith('c')) return ['第\u00a0' + p[1].slice(1) + '\u00a0段', '第\u00a0' + p[2].slice(1) + '\u00a0镜']
  if (p.length === 2 && p[1].startsWith('g')) return ['第\u00a0' + p[1].slice(1) + '\u00a0段']
  return [scope === 'e1' ? '第\u00a01\u00a0集' : String(scope)]
}
const scopeName = scope => scopeParts(scope).join(' ')
const scopeHtml = scope => { const p = scopeParts(scope); return p.length > 1 ? '<span class="up">' + esc(p.slice(0, -1).join(' ')) + '</span>' + esc(p[p.length - 1]) : esc(p[0]) }
const KIND = { entity_brief: '外观设计', entity_desc: '出图描述', blocking: '站位', keyframe_desc: '关键帧描述', timeline: '时间轴', entity_image: '设定图', keyframe: '关键帧', audition: '试音', clip_draft: '草稿', cut_draft: '整集草稿', cut_final: '交付片' }
function kindLabel(kind, scope) {
  const p = String(scope).split('/')
  if (kind === 'entity_image' && p.length === 4) return p[1] === 'loc' ? '机位图' : p[3]
  return KIND[kind] || kind
}
const media = id => '/api/media/' + id

// ---------- lightbox ----------
// Pictures come in three shapes (1672×941 views and keyframes, 1024×1536 portraits, 1254×1254 close-ups);
// the size only reserves room before the picture loads, its own proportions win after.
const DIM = { wide: [1672, 941], tall: [1024, 1536], square: [1254, 1254] }
function shapeOf(scope) {
  const p = String(scope).split('/')
  if (p[1] !== 'char') return 'wide'
  if (p.length === 3) return 'tall'
  return p[3].includes('特写') ? 'square' : 'wide'
}
const zimg = (id, alt, shape, eager) => {
  const [w, h] = DIM[shape || 'wide']
  return '<button type="button" class="zoom" onclick="zoom(this)" aria-label="放大看：' + esc(alt) + '"><img data-zoom src="' + media(id) + '" alt="' + esc(alt) + '" width="' + w + '" height="' + h + '" decoding="async"' + (eager ? ' fetchpriority="high"' : ' loading="lazy"') + '></button>'
}
let LB = [], LBI = 0
function zoom(btn) {
  const img = btn.querySelector('img')
  LB = [...document.querySelectorAll('#view img[data-zoom]')]; LBI = Math.max(0, LB.indexOf(img))
  if (!$('#lb').classList.contains('show')) { $('#lb').classList.add('show'); hold(true) }
  showLb(); $('#lbclose').focus()
}
function showLb() {
  const img = LB[LBI]
  $('#lbimg').src = img.src; $('#lbimg').alt = img.alt; $('#lbcap').textContent = img.alt
  $('#lbcount').textContent = (LBI + 1) + ' / ' + LB.length
  $('#lb').classList.toggle('one', LB.length < 2)
}
function stepLb(d) { if (!LB.length) return; LBI = (LBI + d + LB.length) % LB.length; showLb() }
function closeLb() { if (!$('#lb').classList.contains('show')) return; $('#lb').classList.remove('show'); hold(false) }
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb' || e.target.tagName === 'FIGURE') closeLb() })
document.addEventListener('keydown', e => {
  if ($('#lb').classList.contains('show')) {
    if (e.key === 'Escape') closeLb()
    else if (e.key === 'ArrowLeft') stepLb(-1)
    else if (e.key === 'ArrowRight') stepLb(1)
  } else if (e.key === 'Escape' && $('#modal').classList.contains('show')) $('#mno').click()
})

// ---------- timeline ----------
function tlTable(t, id, playable) {
  if (!t) return ''
  let rows = ''
  for (const c of t.cuts) {
    const tags = (c.present && c.present.backs && c.present.backs.length ? '<span class="tag blue">背影：' + esc(c.present.backs.join('、')) + '</span>' : '') + (c.location ? '<span class="tag">' + esc(c.location) + '</span>' : '')
    rows += '<div class="cut"><div class="cut-h"><b>第 ' + c.index + ' 镜</b><span class="t">' + c.start + '–' + c.end + ' 秒</span>' + tags + '</div>' +
      (c.camera ? '<div class="cam">' + esc(c.camera) + '</div>' : '') + '<div class="shot">' + esc(c.shot) + '</div></div>'
    for (const e of t.timeline.filter(e => e.second >= c.start && e.second < c.end)) {
      const lines = t.lines.filter(l => Math.floor(l.start) === e.second).map(l => '<span class="line">' + esc(l.speaker) + '：' + esc(l.text) + '</span>').join('')
      const inner = '<span class="t">' + e.second + 's</span><span>' + esc(e.text) + lines + '</span>'
      rows += playable
        ? '<button type="button" class="sec" data-t="' + e.second + '" onclick="seek(\'' + id + '\',' + e.second + ')">' + inner + '</button>'
        : '<div class="sec" data-t="' + e.second + '">' + inner + '</div>'
    }
  }
  return '<div class="tl" id="tl' + id + '"' + (playable ? ' role="group" aria-label="逐秒时间轴，点一行跳到那一秒"' : '') + '>' + rows + '</div>'
}
function seek(id, t) { const v = document.getElementById('v' + id); if (v) { v.currentTime = t; v.play() } }
document.addEventListener('timeupdate', e => {
  const v = e.target; if (!v.id || !v.id.startsWith('v')) return
  const id = v.id.slice(1), s = Math.floor(v.currentTime)
  const box = document.getElementById('tl' + id); if (!box) return
  box.querySelectorAll('.sec.now').forEach(x => x.classList.remove('now'))
  const row = box.querySelector('.sec[data-t="' + s + '"]'); if (row) { row.classList.add('now'); if (!v.paused) row.scrollIntoView({ block: 'nearest' }) }
}, true)

// ---------- reviews ----------
const reviseHint = a => a.kind === 'entity_image' || a.kind === 'keyframe' ? '会先改描述给你审，通过后再重出图（要再授权）' : a.kind === 'clip_draft' ? '会先改这一段的时间轴给你审，通过后关键帧和草稿再重出' : '会带着这条意见重写'
function reviseBox(id, onsubmit, hint, label = '按意见重写') {
  return '<div class="revise" id="rv' + id + '"><label class="vh" for="rt' + id + '">修改意见</label><textarea id="rt' + id + '" name="revise-' + id + '" data-keep="rt' + esc(S.project) + '/' + id + '" autocomplete="off" aria-describedby="rvh' + id + '" placeholder="哪里不对、要怎么改…"></textarea>' +
    '<div class="note-bar"><span class="hint" id="rvh' + id + '">' + esc(hint) + '</span><button type="button" class="btn sm quiet" onclick="toggleRv(' + id + ')">收起</button><button type="button" class="btn sm primary" onclick="' + onsubmit + '">' + icon('edit') + label + '</button></div></div>'
}
function toggleRv(id) {
  const el = document.getElementById('rv' + id), open = el.classList.toggle('open')

}
async function sendCardRevise(review, artifact) {

}
async function sendEdit(review, artifact) {
  const el = document.getElementById('rt' + artifact)
  const v = needText(el, '先写这一张哪里要改'); if (!v) return

}
// Where a candidate drawn from another one came from and what was asked; the one it came from is marked as the original.
function editedOf(a, r) {
  const p = a.payload || {}
  if (r.artifacts.some(x => x.payload && x.payload.edited_from === a.id)) return '<div class="notice">' + icon('image') + '<span>原图：下面几张是照它改的，改得不好可以选回它</span></div>'
  if (!p.edited_from) return ''
  const k = r.artifacts.findIndex(x => x.id === p.edited_from)
  return '<div class="notice ok">' + icon('edit') + '<span>照' + (k >= 0 ? '候选 ' + (k + 1) : '上一版') + '改：' + esc(p.instruction) + '</span></div>'
}
function drawer(title, body, key, badge, open) {
  return '<details class="drawer" data-key="' + esc(key) + '"' + (open ? ' open' : '') + '><summary>' + esc(title) + (badge || '') + '</summary><div class="body">' + body + '</div></details>'
}
function mediaOf(a, r, eager) {
  const p = a.payload || {}
  if (a.media && a.mime && a.mime.startsWith('image/')) return '<div class="well">' + zimg(a.media, scopeName(r.scope) + ' ' + kindLabel(a.kind, r.scope) + '，第 ' + a.version + ' 版', shapeOf(r.scope), eager) + '</div>'
  if (a.media && a.mime === 'video/mp4') return '<div class="clip' + (a.timeline ? '' : ' solo') + '"><div class="well"><video id="v' + a.id + '" controls preload="metadata" src="' + media(a.media) + '"></video></div>' + (a.timeline ? tlTable(a.timeline, a.id, true) : '') + '</div>'
  if (a.media && a.mime && a.mime.startsWith('audio/')) return '<audio controls src="' + media(a.media) + '"></audio>'
  if (a.kind === 'timeline') return tlTable(p, a.id, false)
  if (a.reading) return (a.still ? '<div class="well">' + zimg(a.still, scopeName(r.scope) + ' 的主图', 'wide', eager) + '</div>' : '') + '<div class="reading"><div>' + esc(a.reading) + '</div></div>'
  if (p.text && !a.media) return '<div class="reading"><div>' + esc(p.text) + '</div></div>'
  return ''
}
function infoOf(a) {
  const p = a.payload || {}
  let h = ''
  if (p.line) h += '<div class="notice ok">' + icon('sparkle') + '<span>试音台词：「' + esc(p.line) + '」，' + p.seconds + ' 秒</span></div>'
  if (p.dropped && p.dropped.length) h += '<div class="notice">' + icon('alert') + '<span>超过 9 张参考图或 3 段音色的上限，没绑上：' + esc(p.dropped.join('、')) + '</span></div>'
  if (p.unmeasured && p.unmeasured.length) h += '<div class="notice">' + icon('alert') + '<span>这几句没从声音里找到，字幕用的是计划时间：' + esc(p.unmeasured.join(' / ')) + '</span></div>'
  if (p.adjusted && p.adjusted.length) h += '<div class="notice">' + icon('alert') + '<span>这些段的裁剪超出允许范围，被程序收紧过：' + esc(p.adjusted.join('、')) + '</span></div>'
  if (p.checks) h += '<table class="checks"><tbody>' + p.checks.map(c => '<tr><td>' + esc(c.check) + '</td><td>' + (c.ok ? '<span class="tag green">通过</span> ' : '<span class="tag red">不通过</span> ') + esc(c.detail) + '</td></tr>').join('') + '</tbody></table><div class="hint">交付文件夹：<span translate="no">' + esc(p.folder) + '</span></div>'
  let drawers = ''
  for (const c of a.context) drawers += drawer(c.title, '<pre>' + esc(c.body) + '</pre>', 'c' + a.id + c.title, '', c.title === '你的意见' || c.title === '和上一版比')
  if (p.prompt) drawers += drawer('提示词', '<pre>' + esc(p.prompt) + '</pre>', 'p' + a.id)
  return h + (drawers ? '<div class="drawers">' + drawers + '</div>' : '')
}
async function redo(r) { if (await ask('重出一次？', '同样的输入换一个种子再出一次，要再授权才会真的出。', '重出', 'spend')) decide(r, { action: 'redo' }, '已排队重出') }
function reviewCard(r, first) {
  const many = r.artifacts.length > 1
  const a0 = r.artifacts[0]
  const video = r.artifacts.some(a => a.mime === 'video/mp4')
  const paid = r.artifacts.some(a => a.media)
  const pickOne = r.point === 5 || r.point === 7
  // Candidates of one review come from the same text, so one note per review goes to it.
  const target = r.artifacts.find(a => a.revisable)
  const editable = many && r.artifacts.some(a => a.editable)
  const note = target
    ? '<div class="note"><label for="rc' + r.id + '">' + (editable ? '评审意见（几张都不对时用）' : '评审意见') + '</label><textarea id="rc' + r.id + '" name="note-' + r.id + '" data-keep="rc' + esc(S.project) + '/' + r.id + '" autocomplete="off" aria-describedby="rh' + r.id + '" placeholder="哪里不对、要怎么改，例如：石台再旧一些，锁链上要有锈迹…"></textarea>' +
      '<div class="note-bar"><span class="hint" id="rh' + r.id + '">' + esc(reviseHint(target)) + (editable ? '。只想改某一张，点那张下面的「照这张改」' : '') + '</span><button type="button" class="btn primary" onclick="sendCardRevise(' + r.id + ',' + target.id + ')">' + icon('edit') + '按意见重写</button></div></div>'
    : '<div class="note none">这一步没有可改的文字。不满意就点「重出」，换一个种子再出一次。</div>'
  let decideBar = paid ? '<button type="button" class="btn" onclick="redo(' + r.id + ')">' + icon('redo') + '重出</button>' : ''
  decideBar += '<span class="sp"></span>'
  if (many) decideBar += '<span class="hint">在上面的候选里点「选这张」</span>'
  else decideBar += '<button type="button" class="btn pass big" onclick="decide(' + r.id + ',{action:\'' + (pickOne ? 'pick' : 'approve') + '\',artifact:' + a0.id + '},\'已通过\')">' + icon('check') + (r.point === 7 ? '采用' : '通过') + '</button>'
  const desk = (wide, info) => '<div class="desk' + (wide ? ' wide' : '') + '"><div class="info">' + info + '</div><div class="act">' + note + '<div class="decide">' + decideBar + '</div></div></div>'
  const head = '<header class="rv-head"><span class="tag gold kind">' + esc(kindLabel(a0.kind, r.scope)) + '</span><h2 id="rvh-' + r.id + '">' + scopeHtml(r.scope) + '</h2>' +
    '<span class="meta">' + (many ? r.artifacts.length + ' 个候选，选一个' : '第 ' + a0.version + ' 版') + '</span><span class="sp"></span>' +
    '<span class="meta" translate="no">' + esc(r.scope) + '</span><span class="meta">审核 ' + r.id + '</span></header>'
  let body
  if (many) {
    body = '<div class="cands">' + r.artifacts.map((a, i) => '<div class="cand">' + mediaOf(a, r, first) +
      '<div class="cand-bar"><b>候选 ' + (i + 1) + '</b><span class="meta">第 ' + a.version + ' 版</span><span class="sp"></span>' + (a.editable ? '<button type="button" class="btn" onclick="toggleRv(' + a.id + ')" aria-expanded="false" aria-controls="rv' + a.id + '">' + icon('edit') + '照这张改</button>' : '') +
      '<button type="button" class="btn pass" onclick="decide(' + r.id + ',{action:\'pick\',artifact:' + a.id + '},\'已选定\')">' + icon('check') + '选这张</button></div>' +
      (a.editable ? reviseBox(a.id, 'sendEdit(' + r.id + ',' + a.id + ')', '以这张为底，只改你写的地方，出 2 张新的（要授权 2 张）；这张也留着对比', '照这张改') : '') +
      editedOf(a, r) + infoOf(a) + '</div>').join('') + '</div>' + desk(true, '')
  } else if (video) body = '<div class="stage">' + mediaOf(a0, r, first) + '</div>' + desk(true, infoOf(a0))
  else body = '<div class="split"><div class="stage">' + mediaOf(a0, r, first) + '</div>' + desk(false, infoOf(a0)) + '</div>'
  return '<section class="rv" aria-labelledby="rvh-' + r.id + '">' + head + body + '</section>'
}
function reviewsPage(point) {
  const list = S.reviews.filter(r => r.point === point)
  if (!list.length) return emptyState('inbox', '这一项都审完了', '新的待审会出现在左边「待审」里。', '<a class="btn" href="#progress">看进度</a>')
  return list.map((r, i) => reviewCard(r, i === 0)).join('')

const STATUS = { draft: ['待审', 'gold'], stale: ['等重做', 'red'] }
const st = x => x && STATUS[x.status] ? ' <span class="tag ' + STATUS[x.status][1] + '">' + STATUS[x.status][0] + '</span>' : ''
const txt = x => x && x.payload && x.payload.text ? x.payload.text : ''
function libRevise(x, hint) {

async function sendLibRevise(id) {

}
function entities(list) {
  const [label, ic] = LIB[tab]
  if (!list.length) return emptyState(ic, '还没有' + label, '剧本拆出出场清单后，' + label + '会出现在这里。')
  const shape = tab === 'characters' ? 'tall' : 'wide'
  return '<div class="ents ' + tab + '">' + list.map(e => {
    const cover = e.image && e.image.media ? zimg(e.image.media, e.name + ' 设定图', shape) : '<span>还没出图</span>'
    const extras = e.extras.length ? '<div class="thumbs">' + e.extras.map(x => {
      const sq = x.label.includes('特写')
      return '<figure class="thumb' + (sq ? ' square' : '') + '"><div class="well">' + (x.image && x.image.media ? zimg(x.image.media, e.name + ' ' + x.label, sq ? 'square' : 'wide') : '<span>未出</span>') + '</div>' +
        '<figcaption>' + esc(x.label) + st(x.image) + (x.note ? '<small title="' + esc(x.note) + '">' + esc(x.note) + '</small>' : '') + '</figcaption></figure>'
    }).join('') + '</div>' : ''
    return '<section class="ent" aria-label="' + esc(e.name) + '"><div class="well cover ' + shape + '">' + cover + '</div><div class="ent-body"><h2>' + esc(e.name) + st(e.image) + '</h2>' + extras +
      (txt(e.brief) ? drawer('外观要点', '<pre>' + esc(txt(e.brief)) + '</pre>', 'b' + e.scope, st(e.brief), true) : '') + (txt(e.desc) ? drawer('定妆描述', '<pre>' + esc(txt(e.desc)) + '</pre>', 'd' + e.scope) : '') +
      libRevise(e.brief, '改外观设计，描述和图会跟着重来') + '</div></section>'
  }).join('') + '</div>'
}
function formatScreenplay(text) {
  return String(text || '').split('\n').map(line => {
    const l = line.trim(); if (!l) return ''
    if (/^场\d+/.test(l)) return '<div class="h">' + esc(l) + '</div>'
    if (l.startsWith('△')) return '<div class="act">' + esc(l.slice(1).trim()) + '</div>'
    if (/^\[变化\]/.test(l)) return '<div class="chg">' + esc(l.replace(/^\[变化\]\s*/, '')) + '</div>'
    const m = /^([^：:△\[\]，。]{1,16})[：:](.+)$/.exec(l)
    if (m) return '<div class="say' + (m[1].includes('画外音') ? ' vo' : '') + '"><b>' + esc(m[1]) + '</b>：' + esc(m[2]) + '</div>'
    return '<div class="set">' + esc(l) + '</div>'
  }).join('')
}
function rosterAside(r, extra) {
  return '<div class="aside"><h2>出场</h2><ul class="people">' + r.characters.map(c => '<li><b>' + esc(c.name) + '</b><span class="meta">' + esc([c.gender, c.age_look].filter(Boolean).join('，')) + '</span>' + (c.tier ? '<span class="tag">' + esc(c.tier) + '</span>' : '') + '</li>').join('') + '</ul>' +
    '<dl><dt>地点</dt><dd>' + (r.locations.map(l => esc(l.name)).join('、') || '无') + '</dd><dt>道具</dt><dd>' + (r.props.map(p => esc(p.name)).join('、') || '无') + '</dd></dl>' + (extra || '') + '</div>'
}
const beatStat = beats => '<div class="stat"><span><b>' + beats.length + '</b>拍</span><span>约 <b>' + beats.reduce((a, b) => a + b.seconds, 0) + '</b>秒</span></div>'
function scriptPage(sc) {
  if (!sc) return emptyState('scroll', '还没有剧本', '在「新故事」里写好剧本、建成项目后，剧本会出现在这里。', '<a class="btn" href="#story">去写故事</a>')
  let page = ''
  for (const s of sc.scenes) {

    for (const b of s.beats) page += '<div class="beat"><span class="id"><span translate="no">' + esc(b.id) + '</span><br>' + b.seconds + 's</span><div><div class="act">' + esc(b.action) + '</div>' +
      b.lines.map(l => '<div class="say' + (l.vo ? ' vo' : '') + '"><b>' + esc(l.speaker) + (l.vo ? '（画外音）' : '') + '</b>：' + esc(l.text) + '</div>').join('') +

  }
  return '<div class="screenplay"><article class="page">' + page + '</article>' + rosterAside(sc.roster, beatStat(sc.scenes.flatMap(s => s.beats))) + '</div>'

function storyboard(list) {
  if (!list.length) return emptyState('film', '还没有分段', '人物、地点、道具都定下来后，会自动分段。')

    '<div class="body"><div>' + (s.timeline ? tlTable(s.timeline.payload, 's' + s.id, false) : '<div class="skeleton" style="height:80px"></div><div class="meta" style="margin-top:6px">时间轴还没写</div>') + libRevise(s.timeline, '改这一段的时间轴，关键帧和草稿都会重来') + '</div>' +

}
const vid = x => x && x.media ? '<div class="well"><video controls preload="metadata" src="' + media(x.media) + '"></video></div>' : ''
function videos(l) {
  let h = ''
  if (l.speakers.length) h += '<h2 class="sec">' + icon('sparkle') + '试音与音色</h2><div class="clips voices">' + l.speakers.map(v => '<div class="clipbox"><h3>' + esc(v.name) + st(v.audition) + '</h3>' + vid(v.audition) +

  if (l.cutDraft) h += '<h2 class="sec">' + icon('film') + '整集草稿</h2><div class="clipbox" style="max-width:1100px">' + vid(l.cutDraft) + '</div>'

const STEPS = [['directions', '故事方向'], ['setup', '本集设定'], ['script', '剧本初稿'], ['script-review', '审读'], ['script-revised', '改写'], ['script-extract', '拆成拍']]
function stepsBar(s) {
  const done = { directions: !!s.directions, setup: !!s.setup, script: !!s.draft, 'script-review': !!s.review, 'script-revised': !!s.text, 'script-extract': !!s.script }
  return '<ol class="steps" aria-label="写作步骤">' + STEPS.map(([k, v], i) => {
    const now = s.busy && s.step === k
    return '<li class="' + (now ? 'now' : done[k] ? 'done' : '') + '"' + (now ? ' aria-current="step"' : '') + '><i aria-hidden="true">' + (now ? '<span class="spin sm"></span>' : done[k] ? '✓' : i + 1) + '</i>' + v + (now ? '<span class="vh">（正在写）</span>' : done[k] ? '<span class="vh">（已完成）</span>' : '') + '</li>'
  }).join('') + '</ol>'
}
// What the step being written has put down so far, as the model writes it; JSON steps show what can be read of them.
function livePane(s) {
  const label = (STEPS.find(x => x[0] === s.step) || [, '剧本'])[1]
  const live = s.live || { text: '', seconds: 0 }, t = live.text
  let body
  if (!t) body = '<div class="wait">在构思，字一出来就显示在这里…</div>'
  else if (s.step === 'directions') {
    const titles = [...t.matchAll(/"title"\s*:\s*"((?:[^"\\]|\\.)*)"/g)].map(m => m[1])
    body = titles.length ? '<div class="wait">已经想好的方向：</div>' + titles.map((x, i) => '<div class="h">方向 ' + (i + 1) + '　' + esc(x) + '</div>').join('') : '<div class="wait">正在想第一个方向…</div>'
  } else if (s.step === 'script-extract') body = '<div class="wait">已拆出 ' + (t.match(/"action"\s*:/g) || []).length + ' 拍</div>'
  else if (s.step === 'script' || s.step === 'script-revised') body = formatScreenplay(t)
  else body = '<pre>' + esc(t) + '</pre>'
  return '<section class="live" role="status" aria-live="off"><div class="head"><span class="spin"></span><b>正在写「' + esc(label) + '」</b><span class="sp"></span><span class="meta">' +
    (t ? '已写 ' + t.length + ' 字，' : '') + '这一步 ' + live.seconds + ' 秒</span></div><article class="page" id="livebody">' + body + '<span class="caret" aria-hidden="true"></span></article></section>'
}
// The parts already written while the rest is still being written.
function doneParts(s) {
  const parts = []
  if (s.setup) parts.push(drawer('本集设定', '<pre>' + esc(s.setup) + '</pre>', 'ws'))
  if (s.draft && s.text !== s.draft) parts.push(drawer('剧本初稿', '<div class="page">' + formatScreenplay(s.draft) + '</div>', 'wd'))
  if (s.review) parts.push(drawer('审读意见', '<pre>' + esc(s.review) + '</pre>', 'wr'))
  if (s.text && s.step === 'script-revised') parts.push(drawer('上一版剧本', '<div class="page">' + formatScreenplay(s.text) + '</div>', 'wt'))
  return parts.length ? '<div class="done-parts">' + parts.join('') + '</div>' : ''
}
function storyStatus(s) {
  if (s.busy) return '<span class="tag blue"><span class="spin sm"></span>正在写</span>'
  if (s.project) return '<span class="tag green">已建项目</span>'
  if (s.script) return '<span class="tag gold">剧本待你看</span>'
  if (s.text) return '<span class="tag gold">正文待你改</span>'
  if (s.directions && s.chosen === undefined) return '<span class="tag gold">方向待你挑</span>'
  return s.error ? '<span class="tag red">出错了</span>' : '<span class="tag">未完成</span>'
}
// Same list as DIRECTION_FIELDS in storyflow.ts; the last three are from stories written before 2026-10-28.

  return '<article class="dir"><div class="num">方向 ' + (i + 1) + '</div><h3>' + esc(d.title) + '</h3><p class="logline">' + esc(d.logline) + '</p>' +
    '<dl>' + DIRECTION_FIELDS.filter(([k]) => k !== 'logline' && d[k]).map(([k, label]) => f(label, d[k])).join('') + '</dl>' +
    (chosen === undefined ? '<button type="button" class="btn primary" onclick="chooseDir(' + i + ')">' + icon('check') + '就写这个</button>' : '') + '</article>'

// ---------- progress ----------
const LABEL = { done: '完成', review: '待审', running: '在跑', queued: '排队', failed: '失败', waiting: '等前置' }
async function resubmit(id) { if (await ask('重提这个视频任务？', '它可能没提交成功。重提会再占一次 GPU。', '重提', 'spend')) act('/api/jobs/' + id + '/resolve', {}, '已重提') }
function progressPage() {
  const all = S.progress.flatMap(n => n.items), c = k => all.filter(i => i.status === k).length
  let h = '<div class="pstat">' + [['在跑', c('running'), 'blue'], ['排队', c('queued'), 'blue'], ['待审', c('review'), 'gold'], ['失败', c('failed') + S.unknown.length, 'red'], ['完成', c('done') + ' / ' + all.length, '']].map(([k, v, t]) => '<div class="' + (v ? t : '') + '"><b>' + v + '</b>' + k + '</div>').join('') + '</div>'
  // Everything that failed goes on top with its fix, so nothing has to be hunted for in the grid below.
  const fails = S.progress.flatMap(n => n.items.filter(i => i.status === 'failed').map(i => '<div class="notice bad">' + icon('alert') + '<span><b>' + esc(n.title + ' ' + scopeName(i.scope)) + '</b>：' + esc(i.error) + '</span>' + (i.run ? '<button type="button" class="btn sm" onclick="act(\'/api/node-runs/' + i.run + '/retry\',{},\'已重试\')">重试</button>' : '') + '</div>'))
  const lost = S.unknown.map(j => '<div class="notice bad">' + icon('alert') + '<span><b>视频任务 ' + j.id + '</b> 可能没提交成功：' + esc(j.error) + '</span><button type="button" class="btn sm" onclick="resubmit(' + j.id + ')">重提</button></div>')
  if (fails.length || lost.length) h += '<h2 class="sec">要处理</h2><div class="fail">' + lost.concat(fails).join('') + '</div><h2 class="sec">每一步</h2>'
  h += '<div class="nodes">' + S.progress.map(n => {
    const count = k => n.items.filter(i => i.status === k).length
    const head = '<h2>' + esc(n.title) + '<span class="meta">' + count('done') + ' / ' + n.items.length + '</span></h2>'
    if (n.items.every(i => i.status === 'done')) return '<section class="node">' + head + '<span class="chip done">全部完成</span></section>'
    return '<section class="node">' + head + '<div class="chips">' + n.items.map(i => '<span class="chip ' + i.status + '" title="' + esc(i.scope) + '">' + esc(scopeName(i.scope)) + '<em>' + LABEL[i.status] + '</em></span>').join('') + '</div></section>'
  }).join('') + '</div>'
  return h
}

const PHASES = [['设计', ['brief', 'desc', 'image', 'derive']], ['分镜', ['plan', 'timeline', 'views', 'view', 'kfdesc', 'keyframe']], ['声音与草稿', ['audition', 'voice', 'draft', 'trim', 'cut_draft']], ['成片', ['refine', 'cut_final']]]
function phases() {
  return PHASES.map(([name, nodes]) => {
    const ns = S.progress.filter(n => nodes.includes(n.node))
    const items = ns.flatMap(n => n.items), done = items.filter(i => i.status === 'done').length
    const bar = ns.map(n => {
      const t = n.items.length || 1, c = k => n.items.filter(i => i.status === k).length
      const w = (k, cls) => c(k) ? '<b class="' + cls + '" style="width:' + (100 * c(k) / t) + '%"></b>' : ''
      const tip = n.title + '：完成 ' + c('done') + ' / ' + n.items.length + (c('review') ? '，待审 ' + c('review') : '') + (c('running') + c('queued') ? '，在跑 ' + (c('running') + c('queued')) : '') + (c('failed') ? '，失败 ' + c('failed') : '')
      return '<i title="' + esc(tip) + '">' + w('done', 'g') + w('review', 'y') + (c('running') + c('queued') ? '<b class="n" style="width:' + (100 * (c('running') + c('queued')) / t) + '%"></b>' : '') + w('failed', 'r') + '</i>'

const NODE = { image: '定妆照', derive: '三视图、特写与服装平铺', view: '机位图', keyframe: '关键帧', audition: '试音', draft: '草稿', refine: '精修' }
function batch(pool) {
  const list = S.pending.filter(p => !p.gpu && p.pool === pool)
  const n = list.reduce((x, p) => x + p.count, 0)
  const per = {}
  for (const p of list) per[p.node] = (per[p.node] || 0) + p.count
  return { n, brief: Object.entries(per).map(([k, c]) => (NODE[k] || k) + ' ' + c + (pool === 'image' ? ' 张' : ' 段')).join('、'), what: list.map(p => (NODE[p.node] || p.node) + ' ' + scopeName(p.scope) + (p.count > 1 ? ' ×' + p.count : '')).join('、') }
}
async function grant(pool) {
  const b = batch(pool)

  const body = pool === 'image'
    ? '约 ' + usd(b.n * S.imageUsd) + '，按每张 ' + USD4.format(S.imageUsd) + ' 的报价上限估。\n\n' + b.what
    : b.what + (S.gpu ? '' : '\n\nGPU 现在离线，授权后等它开机才跑。')
  if (await ask(pool === 'image' ? '开始出图 ' + b.n + ' 张？' : '开始出片 ' + b.n + ' 段？', body, pool === 'image' ? '开始出图' : '开始出片', 'spend')) act('/api/permits', { scope: 'e1', pool, count: b.n }, '已授权')
}

  if (img.n) h += '<div class="what">' + esc(img.brief) + '</div><button type="button" class="btn spend grant" onclick="grant(\'image\')">' + icon('image') + '开始出图 ' + img.n + ' 张，约 ' + usd(img.n * S.imageUsd) + '</button>'
  if (vidb.n) h += '<div class="what">' + esc(vidb.brief) + (S.gpu ? '' : '。GPU 离线，授权后等开机才跑') + '</div><button type="button" class="btn spend grant" onclick="grant(\'video\')">' + icon('video') + '开始出片 ' + vidb.n + ' 段</button>'
  if (gpuWait.length) h += '<div class="notice">' + icon('alert') + '<span>已授权、等 GPU 开机：' + esc(gpuWait.map(p => (NODE[p.node] || p.node) + ' ' + scopeName(p.scope)).join('、')) + '</span></div>'
  return h
}
function paintDock() { const d = dock(); $('#dock').innerHTML = d; $('#dock').classList.toggle('show', !!d); $('#dock').classList.toggle('fold', dockFold) }
function emptyState(ic, title, sub, action) { return '<div class="empty">' + icon(ic) + '<b>' + esc(title) + '</b><p>' + esc(sub) + '</p>' + (action || '') + '</div>' }

function titles() {
  if (tab === 'story') return ['新故事', SID ? '' : '一句想法，三个方向，一个剧本，再建成项目']
  if (tab === 'progress') return ['进度', '每一步在每个人物、地点、段落上的状态']
  if (LIB[tab]) return [LIB[tab][0], '现在用的版本；标「待审」「等重做」的还没定下来']
  const n = S.reviews.filter(x => x.point === tab).length
  const r = S.reviews.find(x => x.point === tab)
  return ['★' + tab + ' ' + (r ? r.title : ''), n + ' 项待审，逐张看完写意见或通过']
}
// Keep what the creator is in the middle of across a re-render: drawers, note boxes, focus, caret, scroll.
const FOCUSABLE = 'a[href], button, textarea, select, summary, video, audio'
const focusSig = el => !el || el === document.body ? null : [el.tagName, el.id, el.getAttribute('href'), el.getAttribute('onclick'), el.tagName === 'SUMMARY' ? el.parentElement.dataset.key : ''].join('|')
function snapshot() {
  const a = document.activeElement
  return {
    open: Object.fromEntries([...document.querySelectorAll('details[data-key]')].map(d => [d.dataset.key, d.open])),
    rv: [...document.querySelectorAll('.revise.open')].map(d => d.id),
    focus: focusSig(a), sel: a && a.tagName === 'TEXTAREA' ? [a.selectionStart, a.selectionEnd] : null,
    tl: Object.fromEntries([...document.querySelectorAll('.tl[id]')].map(t => [t.id, t.scrollTop])),
    y: window.scrollY,
    // The live text follows the writing unless the creator has scrolled up in it to read.
    live: (b => !b ? null : b.scrollHeight - b.scrollTop - b.clientHeight < 40 ? 'end' : b.scrollTop)(document.getElementById('livebody')),
  }
}
function restore(s) {
  for (const d of document.querySelectorAll('details[data-key]')) if (d.dataset.key in s.open) d.open = s.open[d.dataset.key]
  s.rv.forEach(id => { const d = document.getElementById(id); if (d) { d.classList.add('open'); document.querySelectorAll('[aria-controls="' + id + '"]').forEach(b => b.setAttribute('aria-expanded', 'true')) } })
  for (const t of document.querySelectorAll('[data-keep]')) if (DRAFTS[t.dataset.keep] !== undefined) t.value = DRAFTS[t.dataset.keep]
  for (const [id, top] of Object.entries(s.tl)) { const t = document.getElementById(id); if (t) t.scrollTop = top }
  if (s.focus) {
    const t = [...document.querySelectorAll(FOCUSABLE)].find(x => focusSig(x) === s.focus)
    if (t) { t.focus({ preventScroll: true }); if (s.sel && t.setSelectionRange) t.setSelectionRange(s.sel[0], s.sel[1]) }
  }
  const b = document.getElementById('livebody')
  if (b) b.scrollTop = s.live === null || s.live === 'end' ? b.scrollHeight : s.live
  window.scrollTo(0, s.y)
}

// ---------- routing ----------
// The page lives in the address: #6 (a review point), #characters, #progress, #story or #story/<id>.
function parseHash(h) {
  const [t, id] = decodeURIComponent(String(h || '').replace(/^#/, '')).split('/')
  if (!t) return null
  const key = /^\d+$/.test(t) ? Number(t) : t
  if (typeof key === 'string' && key !== 'story' && key !== 'progress' && !LIB[key]) return null
  return { tab: key, sid: key === 'story' ? id || null : SID }
}
const hashOf = () => tab === 'story' && SID ? 'story/' + SID : String(tab)
function applyHash() {
  const r = parseHash(location.hash); if (!r) return
  tab = r.tab; localStorage.setItem('yx.tab', hashOf())
  if (tab === 'story') { if (r.sid !== SID) { SID = r.sid; ST = null } loadStories() }
  if (LIB[tab]) { L = null; loadLib() }
  lastKey = ''; render(); window.scrollTo(0, 0)
}
window.addEventListener('hashchange', applyHash)
const go = t => { if (location.hash === '#' + t) applyHash(); else location.hash = '#' + t }

function render() {
  if (!S) return
  const groups = new Set(S.reviews.map(r => r.point))
  const want = tab
  if (tab === null || (typeof tab === 'number' && !groups.has(tab))) tab = groups.size ? Math.min(...groups) : (tab === null ? 'story' : 'characters')
  if (tab !== want || location.hash !== '#' + hashOf()) history.replaceState(null, '', '#' + hashOf())
  if (LIB[tab] && LIB[want] === undefined && !L) loadLib()
  const key = JSON.stringify([tab, S, LIB[tab] ? L : null, tab === 'story' ? [SID, ST, STORIES] : null])
  if (key === lastKey) return
  // Never pull a playing clip out from under the creator; the new data shows once it is paused.
  const playing = [...document.querySelectorAll('video, audio')].some(v => !v.paused)
  if (playing && tab === lastTab) return
  lastKey = key
  lastTab = tab
  const snap = snapshot()
  $('#gpudot').className = 'dot ' + (S.gpu ? 'on' : 'off')
  $('#gputext').textContent = S.gpu ? 'GPU 在线' : 'GPU 离线'
  $('#spent').textContent = usd(S.spent.usd)
  $('#videos').textContent = S.spent.videos + ' 段'
  document.title = (S.reviews.length ? '（' + S.reviews.length + ' 待审）' : '') + '言象审核台'
  $('#phases').innerHTML = phases()
  $('#nav').innerHTML = nav()
  const [t, sub] = titles(); $('#title').textContent = t; $('#subtitle').textContent = sub
  $('#view').innerHTML = tab === 'story' ? storyPage() : tab === 'progress' ? progressPage() : LIB[tab] ? libPage() : reviewsPage(tab)
  paintDock()
  restore(snap)
}

// ---------- data ----------
async function loadStatus() {
  try { S = await (await fetch('/api/status')).json() } catch (e) { $('#view').innerHTML = emptyState('alert', '连不上引擎', '确认 bun src/m1/run.ts 还在跑；页面每 4 秒自动重试一次。'); lastKey = ''; return }
  render()
}
async function loadLib() { try { L = await (await fetch('/api/library')).json() } catch (e) { return } render() }
async function loadStories() {
  try {
    if (SID) ST = await (await fetch('/api/stories/' + SID)).json()
    STORIES = await (await fetch('/api/stories')).json()
  } catch (e) { return }
  render()
}
async function loadProjects() {
  try { PROJ = await (await fetch('/api/projects')).json() } catch (e) { return }
  $('#proj').innerHTML = PROJ.projects.map(p => '<option value="' + esc(p.dir) + '"' + (p.current ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('')
  $('#rundot').className = 'dot ' + (PROJ.paused ? 'idle' : 'on')
  $('#runtext').textContent = PROJ.paused ? '已暂停' : '运行中'
  const b = $('#run'); b.innerHTML = PROJ.paused ? icon('play2') + '继续运行' : icon('pause') + '暂停'
}
$('#proj').onchange = async e => { if (await api('/api/projects/switch', { dir: e.target.value }, '已切换（先暂停着）')) { L = null; tab = null; lastKey = ''; await loadProjects(); loadStatus() } else loadProjects() }
$('#run').onclick = async () => { await api('/api/pause', { paused: !PROJ.paused }, PROJ.paused ? '开始跑' : '已暂停'); loadProjects() }

{
  const r = parseHash(location.hash) || parseHash(localStorage.getItem('yx.tab'))
  if (r) { tab = r.tab; SID = r.sid }
}
loadProjects(); loadStories(); loadStatus()
if (LIB[tab]) loadLib()
setInterval(() => { loadStatus(); loadProjects(); if (LIB[tab]) loadLib() }, 4000)
setInterval(() => { if (tab === 'story' || STORIES.some(s => s.busy)) loadStories() }, 3000)
</script>
